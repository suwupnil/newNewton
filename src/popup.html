<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newton Enhancer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-group">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <h1>Newton Enhancer</h1>
      </div>
      <span class="badge">Grauity</span>
    </header>

    <main class="content">
      <div class="card theme-card">
        <div class="card-header-row">
          <div>
            <div class="title-row">
              <span class="card-title">UI Theme</span>
              <span id="currentThemeTag" class="theme-tag">Light</span>
            </div>
            <p class="card-description">Switch between Light, Dark, or System mode.</p>
          </div>
        </div>

        <!-- 3-Segmented Pill Control -->
        <div class="segmented-control" role="radiogroup" aria-label="Theme Selection">
          <button type="button" class="segment-btn" data-theme="light" id="btnThemeLight">
            <svg class="segment-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span>Light</span>
          </button>

          <button type="button" class="segment-btn" data-theme="dark" id="btnThemeDark">
            <svg class="segment-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span>Dark</span>
          </button>

          <button type="button" class="segment-btn" data-theme="system" id="btnThemeSystem">
            <svg class="segment-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <span>System</span>
          </button>
        </div>
      </div>

      <div class="actions">
        <button id="applyBtn" class="btn btn-primary">
          <span>Apply to Active Tab</span>
        </button>
      </div>

      <div id="statusMessage" class="status-message"></div>
    </main>

    <footer class="footer">
      <span>Built for Newton School</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
