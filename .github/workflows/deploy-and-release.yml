name: Deploy & Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # =========================================================================
  # EXTENSION PACKAGING & GITHUB RELEASE (.crx, .zip & .xpi)
  # =========================================================================
  build-and-release-extension:
    name: Package Extension & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Standalone esbuild
        run: |
          npm install -g esbuild

      - name: Extract Manifest Version
        id: ext_version
        run: |
          VERSION=$(jq -r '.version' ./extension/manifest.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: v${VERSION}"

      - name: Run Native Build Pipeline
        run: ./build.sh

      - name: Create ZIP Package
        run: |
          cd dist/extension
          zip -r ../newNewton-v${{ steps.ext_version.outputs.version }}.zip . -x ".*" -x "__MACOSX"
          cd ../..

      - name: Build Signed CRX File
        run: |
          if [ -n "${{ secrets.CRX_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.CRX_PRIVATE_KEY }}" > /tmp/key.pem
            npx --yes crx3 -p /tmp/key.pem -o dist/newNewton-v${{ steps.ext_version.outputs.version }}.crx dist/extension
            cp dist/newNewton-v${{ steps.ext_version.outputs.version }}.crx dist/newNewton.crx
            rm -f /tmp/key.pem
            echo "Successfully generated signed CRX from minified build."
          else
            echo "Notice: CRX_PRIVATE_KEY secret is not set. Skipping .crx generation."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ext_version.outputs.version }}"
          name: "newNewton v${{ steps.ext_version.outputs.version }}"
          body: |
            Automated production build for newNewton v${{ steps.ext_version.outputs.version }}.
            - Chrome Extension (.crx, .zip)
            - Mozilla Firefox Extension (.xpi)
            - macOS Safari Web Extension Bundle
          files: |
            dist/newNewton-v${{ steps.ext_version.outputs.version }}.zip
            dist/newNewton.crx
            dist/newNewton-firefox.xpi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
