[package]
name = "newton-mcp-server"
version = "0.1.0"
edition = "2021"
authors = ["suwupnil"]
description = "Newton LMS Coding Assignment Solver MCP Server over stdio JSON-RPC"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
